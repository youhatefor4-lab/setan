name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout_repo
      uses: actions/checkout@v4

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Install Android SDK Build-Tools
      run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
     
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Tambah jalur pip ke PATH
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install system depedencies
      run:  |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
    
    - name: Install Buildozer
      run:  |
        python -m pip install --upgrade pip
        python -m pip install buildozer==1.5.0

    - name: Cek apakah Buildozer terpasang
      run: buildozer --version
      
    - name: Cache buildozer global directory
      uses: actions/cache@v4
      with:
        path: .buildozer_global
        key: buildozer-global-${{ hashFiles('buildozer.spec')}}

    - name: Cache buildozer android directory
      uses: actions/cache@v4
      with:
        path: .buildozer/android
        key: buildozer-android-${{ hashFiles('buildozer.spec')}}

    - name: Build with buildozer
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk
        
        
        
        






      
