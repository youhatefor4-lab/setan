name: Build APK
on: 
   push:
     branches: [main]
   workflow_dispatch:
   
jobs:
 build:
   runs-on: ubuntu-22.04
   steps:
      - uses: actions/checkout@v4
      - name: Accept Android SDK licences
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licences

      - name: Install Android SDK Build-Tools
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0"
        
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install System dependencies 
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          
      - name: Install buildozer
        run: |
          pip install buildozer cython==0.29.33
      
      - name: Build APK
        run: buildozer android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
  
    
  

